[package]
name = "hasp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

# Messaging gateway for hasp: Telegram, Signal and WhatsApp adapters, durable
# delivery, owner approvals, event inbox and follow-ups. Attaches to the hasp
# daemon; see docs/gateway.md.
[[bin]]
name = "hasp-gateway"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
hasp-edge = { path = "../hasp-edge" }
hasp-recall = { workspace = true }
hasp-wire = { workspace = true }
reqwest = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
