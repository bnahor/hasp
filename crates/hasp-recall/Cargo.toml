[package]
name = "hasp-recall"
version.workspace = true
edition.workspace = true
license.workspace = true

# Node-local recall: a rebuildable full-text index over the session journals
# (which stay canonical) and a small curated memory with provenance.
[dependencies]
anyhow = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
