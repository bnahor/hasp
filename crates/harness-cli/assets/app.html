<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness</title>
<style>
:root {
  --bg: #1d1b18; --panel: #24221f; --panel-2: #2c2a26; --hover: #34312c;
  --line: #36332e; --text: #ece8e1; --muted: #9a948a; --faint: #6f6a62;
  --accent: #f0a04b; --accent-ink: #1d1b18; --user: #302d29;
  --add: #2a3a24; --add-ink: #9fd08a; --del: #45262a; --del-ink: #f0959d;
  --ok: #7cc66d; --err: #ef7b7b; --warn: #e8b654;
  --code: #171614; --shadow: 0 10px 40px rgba(0,0,0,.45);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #faf8f4; --panel: #f1eee8; --panel-2: #e9e5dd; --hover: #e2ddd3;
  --line: #ddd7cc; --text: #221f1a; --muted: #6d675d; --faint: #9a9387;
  --accent: #c8741f; --accent-ink: #fff; --user: #ebe6dd;
  --add: #e3f2dc; --add-ink: #2f6b1f; --del: #f8e0e2; --del-ink: #a3222f;
  --ok: #3f8f32; --err: #c43c3c; --warn: #a8761b; --code: #f3f0ea;
  --shadow: 0 10px 40px rgba(60,40,10,.18);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#app { display: grid; grid-template-columns: var(--side, 272px) 1fr auto; grid-template-rows: 100vh; height: 100vh; overflow: hidden; }
#app.no-side { --side: 0px; }
#app.no-side #sidebar { display: none; }

/* sidebar */
#sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.side-top { display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px; -webkit-app-region: drag; }
.side-top > * { -webkit-app-region: no-drag; }
.side-top .grow { flex: 1; }
.side-search { margin: 4px 12px 8px; }
.side-search input { width: 100%; background: var(--panel-2); border: 1px solid transparent; border-radius: 8px;
  padding: 7px 10px; color: var(--text); font: inherit; outline: none; }
.side-search input:focus { border-color: var(--line); }
#projects { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
.proj { margin-top: 10px; }
.proj-head { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; color: var(--muted);
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em; cursor: pointer; user-select: none; }
.proj-head:hover { background: var(--hover); color: var(--text); }
.proj-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-head .add { opacity: 0; }
.proj-head:hover .add { opacity: 1; }
.proj.closed .sess-list { display: none; }
.sess { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px; border-radius: 8px; cursor: pointer; }
.sess:hover { background: var(--hover); }
.sess.active { background: var(--panel-2); }
.sess .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .when { color: var(--faint); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; opacity: .5; }
.dot.live { background: var(--ok); opacity: 1; }
.dot.busy { background: var(--accent); opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.side-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.side-foot .grow { flex: 1; }

/* main */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; min-height: 54px; -webkit-app-region: drag; }
header > * { -webkit-app-region: no-drag; }
#title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
#where { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .grow { flex: 1; }
.meter { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 12px; }
.meter .bar { width: 64px; height: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--muted); width: 0; }
#scroll { flex: 1; min-height: 0; overflow-y: auto; }
#transcript { max-width: 820px; margin: 0 auto; padding: 18px 28px 40px; }
.empty { max-width: 560px; margin: 16vh auto 0; text-align: center; color: var(--muted); }
.empty h1 { color: var(--text); font-size: 26px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
.row { margin: 18px 0; }
.user { display: flex; justify-content: flex-end; }
.bubble { background: var(--user); padding: 10px 16px; border-radius: 18px; max-width: 78%; white-space: pre-wrap; word-wrap: break-word; }
.bubble .img-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
.md { word-wrap: break-word; }
.md p { margin: 0 0 10px; } .md p:last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { margin: 18px 0 8px; line-height: 1.3; } .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; }
.md ol li::marker { color: var(--accent); font-weight: 600; }
.md code { font: 12.5px var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; margin: 10px 0; }
.md pre .bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; color: var(--faint); font-size: 11.5px; border-bottom: 1px solid var(--line); }
.md pre code { display: block; background: none; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md a { color: var(--accent); }
.md table { border-collapse: collapse; margin: 8px 0; } .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }
.copy { color: var(--faint); font-size: 11.5px; } .copy:hover { color: var(--text); }
.cursor::after { content: "▍"; color: var(--accent); animation: pulse 1s steps(2) infinite; margin-left: 1px; }

.fold { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; overflow: hidden; }
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  color: var(--muted); font-size: 13px; user-select: none; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary:hover { background: var(--panel); }
.fold[open] > summary { border-bottom: 1px solid var(--line); }
.fold .body { padding: 8px 12px; max-height: 420px; overflow: auto; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; color: var(--muted); }
.tool .name { font-family: var(--mono); color: var(--text); font-size: 12.5px; }
.tool .subj { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tool .st { font-size: 12px; } .tool .st.ok { color: var(--ok); } .tool .st.err { color: var(--err); }
.tool .ms { color: var(--faint); font-size: 12px; }
.thinking > summary { font-style: italic; }
.thinking .body { font-family: var(--sans); font-style: italic; white-space: pre-wrap; }
.l-add { color: var(--add-ink); } .l-del { color: var(--del-ink); } .l-hunk { color: var(--accent); }
.note { color: var(--faint); font-size: 12.5px; margin: 6px 0; }
.note.err { color: var(--err); }
.ask { border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.ask .q { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; margin-bottom: 10px; }
.ask .btns { display: flex; gap: 8px; }
.btn { padding: 6px 12px; border-radius: 8px; background: var(--panel-2); font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.ask.done { opacity: .55; border-color: var(--line); background: none; }
.ask.done .btns { display: none; }
.turn-foot { color: var(--faint); font-size: 12px; margin-top: 6px; }

/* composer */
#composer-wrap { padding: 8px 28px 20px; }
#composer { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  padding: 8px 8px 8px 14px; box-shadow: var(--shadow); transition: border-color .15s; }
#composer:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
#composer.drag { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 6px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border-radius: 8px; padding: 3px 4px 3px 8px; font-size: 12.5px; color: var(--muted); }
.chip img { height: 28px; border-radius: 4px; }
.chip button { color: var(--faint); padding: 0 4px; } .chip button:hover { color: var(--text); }
.comp-row { display: flex; align-items: flex-end; gap: 6px; }
#input { flex: 1; resize: none; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-size: 15px;
  line-height: 1.5; max-height: 280px; padding: 6px 0; }
#input::placeholder { color: var(--faint); }
.model { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.model:hover { background: var(--hover); color: var(--text); }
#send { width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; flex: none; }
#send:disabled { opacity: .35; cursor: default; }
#send.stop { background: var(--panel-2); color: var(--text); }
.hint { max-width: 820px; margin: 6px auto 0; color: var(--faint); font-size: 11.5px; text-align: center; }

/* changes pane */
#changes { width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
#app.show-changes #changes { width: var(--changes, 46vw); max-width: 760px; min-width: 360px; }
.ch-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ch-head b { flex: 1; }
.ch-sum { color: var(--faint); font-size: 12px; }
#ch-body { flex: 1; min-height: 0; overflow: auto; }
.file { border-bottom: 1px solid var(--line); }
.file-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  background: var(--panel); cursor: pointer; font: 12.5px var(--mono); }
.file-head .p { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-head .n { font-family: var(--sans); color: var(--faint); font-size: 11.5px; }
.plus { color: var(--add-ink); } .minus { color: var(--del-ink); }
.file.closed .hunks { display: none; }
.hunks { font: 12px/1.55 var(--mono); }
.hunk-h { color: var(--faint); background: var(--panel-2); padding: 2px 14px; }
.dl { display: grid; grid-template-columns: 44px 44px 1fr; white-space: pre; }
.dl .ln { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; cursor: pointer; }
.dl .ln:hover { color: var(--accent); }
.dl .tx { padding: 0 10px; overflow: hidden; }
.dl.add { background: var(--add); } .dl.add .tx { color: var(--add-ink); }
.dl.del { background: var(--del); } .dl.del .tx { color: var(--del-ink); }
.cbox { margin: 4px 10px 8px 88px; font-family: var(--sans); }
.cbox textarea { width: 100%; min-height: 60px; background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 8px; padding: 8px; font: 13px var(--sans); outline: none; resize: vertical; }
.cbox .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.cmt { margin: 4px 10px 8px 88px; background: color-mix(in srgb, var(--accent) 10%, transparent); border-left: 3px solid var(--accent);
  padding: 6px 10px; border-radius: 6px; font: 13px var(--sans); white-space: pre-wrap; }
.ch-empty { padding: 40px 20px; color: var(--muted); text-align: center; }

/* menus, toasts, dialog */
.menu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 6px; min-width: 240px; max-height: 360px; display: flex; flex-direction: column; }
.menu input { background: var(--panel-2); border: 0; outline: none; color: var(--text); padding: 7px 10px; border-radius: 8px; font: inherit; margin-bottom: 4px; }
.menu .items { overflow-y: auto; }
.menu .it { padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
.menu .it:hover, .menu .it.sel { background: var(--hover); }
.menu .it .sub { color: var(--faint); font-size: 12px; }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; }
.toast.err { border-color: var(--err); }
.dialog-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70; display: grid; place-items: start center; padding-top: 18vh; }
.dialog { width: min(520px, 90vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; }
.dialog h3 { margin: 0 0 10px; font-size: 15px; }
.dialog input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: 13px var(--mono); outline: none; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
kbd { font: 11px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
@media (max-width: 900px) { #app { grid-template-columns: 0 1fr auto; } #sidebar { display: none; } #app.show-changes #changes { position: fixed; inset: 0; width: 100%; max-width: none; z-index: 40; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app" class="">
  <aside id="sidebar">
    <div class="side-top">
      <button class="icon-btn" id="btn-side" title="Hide sidebar (⌘B)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div class="grow"></div>
      <button class="icon-btn" id="btn-project" title="Open a project"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg></button>
      <button class="icon-btn" id="btn-new" title="New session (⌘N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="side-search"><input id="filter" placeholder="Search sessions" autocomplete="off"></div>
    <nav id="projects"></nav>
    <div class="side-foot">
      <span id="conn">connecting…</span><span class="grow"></span>
      <button class="icon-btn" id="btn-theme" title="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </aside>

  <main id="main">
    <header>
      <button class="icon-btn" id="btn-side2" title="Show sidebar (⌘B)" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <span id="title">Harness</span><span id="where"></span>
      <span class="grow"></span>
      <span class="meter" id="meter" title="Context window used" hidden><span class="bar"><i></i></span><span class="pct"></span></span>
      <button class="icon-btn" id="btn-changes" title="Changes (⌘J)"><svg viewBox="0 0 24 24"><path d="M6 3v12M18 9v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M6 15c0-4 12-2 12-6"/></svg></button>
    </header>
    <div id="scroll"><div id="transcript"></div></div>
    <div id="composer-wrap">
      <div id="composer">
        <div class="chips" id="chips"></div>
        <div class="comp-row">
          <button class="icon-btn" id="btn-attach" title="Attach image"><svg viewBox="0 0 24 24"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></button>
          <textarea id="input" rows="1" placeholder="Do anything…"></textarea>
          <button class="model" id="btn-model" title="Model"><span id="model-name">model</span><svg viewBox="0 0 24 24" style="width:13px;height:13px"><path d="m6 9 6 6 6-6"/></svg></button>
          <button id="send" title="Send (Enter)" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · <kbd>Esc</kbd> stop · <kbd>⌘J</kbd> changes</div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
  </main>

  <aside id="changes">
    <div class="ch-head"><b>Changes</b><span class="ch-sum" id="ch-sum"></span>
      <button class="icon-btn" id="btn-ch-refresh" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
      <button class="icon-btn" id="btn-ch-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="ch-body"></div>
  </aside>
</div>
<div id="toasts"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token") || sessionStorage.getItem("harness-token") || "";
sessionStorage.setItem("harness-token", TOKEN);
const START_ROOT = params.get("root") || "";
history.replaceState(null, "", location.pathname);

const S = {
  projects: [],          // [{root, name, sessions: [...]}]
  root: null,            // project of the open conversation
  session: null,         // {id, path, title}
  live: {},              // root -> {es, sessionId, busy, stats}
  running: false,
  images: [],            // [{mediaType, data, url}]
  comments: [],          // [{path, line, side, text}]
  models: null,
  streamEl: null, streamText: "", thinkEl: null, thinkText: "",
  closedProjects: new Set(JSON.parse(localStorage.getItem("closed-projects") || "[]")),
};

// ---- utilities ----
async function api(path, body) {
  const opts = { headers: { "x-harness-token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(body); opts.headers["content-type"] = "application/json"; }
  const r = await fetch(path, opts);
  if (r.status === 401) throw new Error("Session token missing or wrong — reopen the app from the terminal.");
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "request failed");
  return j.result;
}
const rpc = (root, method, params = {}) => api("/api/rpc", { root, method, params });
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return "now"; if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h"; if (s < 86400 * 7) return Math.floor(s / 86400) + "d";
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);

// ---- markdown (escape first; only a known subset becomes markup) ----
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => "\u0000" + btoa(unescape(encodeURIComponent(c))) + "\u0000")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')

function markdown(src) {
  const out = []; const lines = esc(src).split("\n");
  let i = 0, list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } };
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^\s*```(\S*)/);
    if (fence) {
      flushPara(); closeList();
      const body = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++;
      out.push(`<pre><div class="bar"><span>${fence[1] || "code"}</span><button class="copy">Copy</button></div><code>${body.join("\n")}</code></pre>`);
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { flushPara(); closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { flushPara(); if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = l.match(/^&gt;\s?(.*)/))) { flushPara(); closeList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); }
    else if (!l.trim()) { flushPara(); closeList(); }
    else { closeList(); para.push(l); }
    i++;
  }
  flushPara(); closeList();
  return out.join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest(".copy");

});
function diffColored(text) {

    /^\+(?!\+\+)/.test(l) ? `<span class="l-add">${l}</span>` :
    /^-(?!--)/.test(l) ? `<span class="l-del">${l}</span>` :
    /^@@/.test(l) ? `<span class="l-hunk">${l}</span>` : l).join("\n");
}

// ---- live connection per project ----
function connect(root) {
  if (S.live[root] && S.live[root].es) return S.live[root];
  const L = S.live[root] = S.live[root] || { busy: false };
  const es = new EventSource(`/events?token=${encodeURIComponent(TOKEN)}&root=${encodeURIComponent(root)}`);
  L.es = es;
  es.onopen = () => { $("#conn").textContent = "connected"; };
  es.onerror = () => { $("#conn").textContent = "reconnecting…"; };
  es.onmessage = ev => onEvent(root, JSON.parse(ev.data));
  return L;
}
function onEvent(root, ev) {
  const here = root === S.root;
  const p = ev.params || {};
  if (ev.method === "session/update") {
    if (!here || (S.session && p.sessionId && p.sessionId !== S.session.id)) return;
    if (p.kind === "delta") streamText(p.text);
    else if (p.kind === "thinking") streamThinking(p.text);
    else if (p.kind === "tool") { endThinking(); clearRunning(); try { addTool(JSON.parse(p.text)); } catch { addNote(p.text); } }
    else if (p.kind === "note" && /^▶\s/.test(p.text)) { endThinking(); endStream(); addRunning(p.text.replace(/^▶\s*/, "")); }
    else if (p.kind === "note") addNote(p.text);
  } else if (ev.method === "permission/request") {
    if (here) addAsk(root, p.id, p.question);
    else toast(`${root.split("/").pop()} needs an approval`);
  } else if (ev.method === "permission/answered") {
    const card = document.querySelector(`.ask[data-id="${p.id}"]`);
    if (card) card.classList.add("done");
  } else if (ev.method === "app/disconnected") {
    toast("Lost the connection to the daemon — reload to reconnect", true);
  }
}

  S.root = root; S.session = s; resetStream();

  const L = connect(root);
  const st = await refreshStats(root);
  if (st && st.sessionId !== s.id) {
    try { await rpc(root, "session/load", { path: s.path }); L.sessionId = s.id; }
    catch (e) { toast(e.message, true); }
  }

  try {

    const r = (st && st.entries <= 1) ? { sessionId: st.sessionId, path: "" } : await rpc(root, "session/new");

}

// ---- model picker ----
function menu(anchor, items, onPick, searchable) {
  closeMenus();
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = (searchable ? `<input placeholder="Search models">` : "") + `<div class="items"></div>`;
  document.body.append(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - 300)) + "px";
  m.style.bottom = (innerHeight - r.top + 8) + "px";
  let sel = 0;
  const draw = () => {
    const f = searchable ? $("input", m).value.toLowerCase() : "";
    const shown = items.filter(i => !f || i.label.toLowerCase().includes(f)).slice(0, 200);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    $(".items", m).innerHTML = shown.map((i, n) => `<div class="it${n === sel ? " sel" : ""}" data-n="${n}"><span>${esc(i.label)}</span><span class="sub">${esc(i.sub || "")}</span></div>`).join("");
    m._shown = shown;
  };
  draw();
  m.onclick = e => { const it = e.target.closest(".it"); if (it) { closeMenus(); onPick(m._shown[+it.dataset.n]); } };
  if (searchable) {
    const inp = $("input", m); inp.focus();
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => {
      if (e.key === "ArrowDown") { sel++; draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
      else if (e.key === "Enter" && m._shown[sel]) { closeMenus(); onPick(m._shown[sel]); }
      else if (e.key === "Escape") closeMenus();
    };
  }
  setTimeout(() => document.addEventListener("mousedown", outside), 0);
  function outside(e) { if (!m.contains(e.target)) { closeMenus(); document.removeEventListener("mousedown", outside); } }
}
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }

      const d = document.createElement("div"); d.className = "dl " + (kind === "ctx" ? "" : kind);
      d.innerHTML = `<span class="ln">${o ?? ""}</span><span class="ln">${n ?? ""}</span><span class="tx"></span>`;
      $(".tx", d).textContent = (kind === "add" ? "+ " : kind === "del" ? "− " : "  ") + text;
      d.querySelectorAll(".ln").forEach(ln => ln.onclick = () => commentBox(d, f.path, kind === "del" ? o : n, kind === "del" ? "old" : "new"));
      frag.append(d);
      for (const c of S.comments.filter(c => c.path === f.path && c.line === (kind === "del" ? o : n) && c.side === (kind === "del" ? "old" : "new"))) {
        const cm = document.createElement("div"); cm.className = "cmt"; cm.textContent = c.text; frag.append(cm);
      }
    }
  }
  if (f.truncated) { const t = document.createElement("div"); t.className = "hunk-h"; t.textContent = "… more lines not shown"; frag.append(t); }
  hunks.append(frag);
  return el;
}
function commentBox(lineEl, path, line, side) {
  document.querySelectorAll(".cbox").forEach(b => b.remove());
  if (line == null) return;
  const b = document.createElement("div"); b.className = "cbox";
  b.innerHTML = `<textarea placeholder="Comment on ${esc(path)}:${line} — it goes to the agent with your next message"></textarea>
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Add comment</button></div>`;
  lineEl.after(b); const ta = $("textarea", b); ta.focus();
  const ok = () => { const t = ta.value.trim(); if (!t) return; S.comments.push({ path, line, side, text: t }); b.remove();
    const cm = document.createElement("div"); cm.className = "cmt"; cm.textContent = t; lineEl.after(cm); renderChips(); };
  $("[data-ok]", b).onclick = ok; $("[data-x]", b).onclick = () => b.remove();
  ta.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ok(); if (e.key === "Escape") b.remove(); };
}
function toggleChanges(force) {
  const on = $("#app").classList.toggle("show-changes", force);
  localStorage.setItem("changes", on ? "1" : "0");
  if (on) loadChanges();
}
$("#btn-changes").onclick = () => toggleChanges();
$("#btn-ch-close").onclick = () => toggleChanges(false);
$("#btn-ch-refresh").onclick = loadChanges;

// ---- projects ----
function openProjectDialog() {
  const back = document.createElement("div"); back.className = "dialog-back";
  back.innerHTML = `<div class="dialog"><h3>Open a project</h3><input placeholder="/path/to/project" value="${esc(S.root || START_ROOT || "")}">
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Open</button></div></div>`;
  document.body.append(back);
  const inp = $("input", back); inp.focus(); inp.select();
  const go = async () => {
    const root = inp.value.trim(); if (!root) return; back.remove();
    try {
      await rpc(root, "session/stats");
      await loadProjects();
      const p = S.projects.find(p => p.root === root || root.startsWith(p.root + "/"));
      if (p && p.sessions[0]) openSession(p.root, p.sessions[0]); else newSession(root);
    } catch (e) { toast(e.message, true); }
  };
  $("[data-ok]", back).onclick = go; $("[data-x]", back).onclick = () => back.remove();
  back.onclick = e => { if (e.target === back) back.remove(); };
  inp.onkeydown = e => { if (e.key === "Enter") go(); if (e.key === "Escape") back.remove(); };
}
$("#btn-project").onclick = openProjectDialog;
$("#btn-new").onclick = () => newSession();

// ---- chrome ----
function toggleSide() {
  const hidden = $("#app").classList.toggle("no-side");
  $("#btn-side2").hidden = !hidden; localStorage.setItem("side", hidden ? "0" : "1");
}
$("#btn-side").onclick = toggleSide; $("#btn-side2").onclick = toggleSide;
function setTheme(t) { document.documentElement.dataset.theme = t; localStorage.setItem("theme", t); }
$("#btn-theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape") { if (document.querySelector(".menu")) closeMenus(); else if (S.running) stop(); }
  else if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); newSession(); }
  else if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSide(); }
  else if (mod && e.key.toLowerCase() === "j") { e.preventDefault(); toggleChanges(); }
  else if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); $("#input").focus(); }
});

// ---- boot ----
(async function boot() {
  setTheme(localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  if (localStorage.getItem("side") === "0") toggleSide();
  if (!TOKEN) { showEmpty(); addNote("Open the app from the terminal (`harness app`) — the page needs its session token.", true); return; }
  await loadProjects();
  $("#conn").textContent = "ready";
  let target = null;
  if (START_ROOT) {
    const p = S.projects.find(p => p.root === START_ROOT);
    target = p && p.sessions[0] ? [p.root, p.sessions[0]] : null;
    if (!target) { await newSession(START_ROOT); }
  }
  if (!target && !S.root) {
    const last = JSON.parse(localStorage.getItem("last") || "null");
    const p = last && S.projects.find(p => p.root === last.root);
    const s = p && p.sessions.find(s => s.path === last.path);
    if (s) target = [p.root, s];
    else if (S.projects[0] && S.projects[0].sessions[0]) target = [S.projects[0].root, S.projects[0].sessions[0]];
  }
  if (target) await openSession(...target);
  else if (!S.root) showEmpty();
  if (localStorage.getItem("changes") === "1") toggleChanges(true);
  setInterval(() => { if (!S.running) loadProjects(); }, 30000);
})();
</script>
</body>
