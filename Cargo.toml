[workspace]
resolver = "2"
members = [
    "crates/hasp-bus",
    "crates/hasp-cli",
    "crates/hasp-config",
    "crates/hasp-desktop",
    "crates/hasp-core",
    "crates/hasp-agents",
    "crates/hasp-diff",
    "crates/hasp-env",
    "crates/hasp-mcp",
    "crates/hasp-provider",
    "crates/hasp-review",
    "crates/hasp-tools",
    "crates/hasp-wire",
    "crates/hasp-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hasp-bus = { path = "crates/hasp-bus" }
hasp-config = { path = "crates/hasp-config" }
hasp-core = { path = "crates/hasp-core" }
hasp-agents = { path = "crates/hasp-agents" }
hasp-diff = { path = "crates/hasp-diff" }
hasp-env = { path = "crates/hasp-env" }
hasp-mcp = { path = "crates/hasp-mcp" }
hasp-provider = { path = "crates/hasp-provider" }
hasp-review = { path = "crates/hasp-review" }
hasp-tools = { path = "crates/hasp-tools" }
hasp-wire = { path = "crates/hasp-wire" }
hasp-workspace = { path = "crates/hasp-workspace" }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "io-std", "sync", "net"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
