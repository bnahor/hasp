[workspace]
resolver = "2"
members = [
    "crates/harness-bus",
    "crates/harness-cli",
    "crates/harness-core",
    "crates/harness-agents",
    "crates/harness-diff",
    "crates/harness-env",
    "crates/harness-mcp",
    "crates/harness-provider",
    "crates/harness-review",
    "crates/harness-tools",
    "crates/harness-wire",
    "crates/harness-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
harness-bus = { path = "crates/harness-bus" }
harness-core = { path = "crates/harness-core" }
harness-agents = { path = "crates/harness-agents" }
harness-diff = { path = "crates/harness-diff" }
harness-env = { path = "crates/harness-env" }
harness-mcp = { path = "crates/harness-mcp" }
harness-provider = { path = "crates/harness-provider" }
harness-review = { path = "crates/harness-review" }
harness-tools = { path = "crates/harness-tools" }
harness-wire = { path = "crates/harness-wire" }
harness-workspace = { path = "crates/harness-workspace" }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "io-std", "sync", "net"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
